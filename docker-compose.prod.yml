# 與 shop 專案共用同一台 VM 與其 Caddy(80/443 由 shop-caddy 佔用),
# 因此這裡不再啟動自己的 Caddy,只讓 web 加入 shop_internal 網路,
# 由 shop 的 Caddyfile 以 focuscabin-web:80 反向代理。
services:
  web:
    image: focuscabin-web:latest
    container_name: focuscabin-web
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - shop_internal

networks:
  shop_internal:
    external: true
